(function(){"use strict";

function home(){var n=list().length;screen.innerHTML='<div class="hero"><div class="eyebrow">🇿🇦 All 9 provinces • South Africa</div><h1>See a problem?<br><span>Help fix it.</span></h1><p>Potholes, leaks, broken sidewalks, blocked drains. One simple report, the right municipal contact, and a record you can follow.</p>'+btn("📸 Report a street problem","new")+'<div class="emoji">🚧</div></div><div class="summary"><div class="stat"><strong>R0</strong><span>Free for residents</span></div><div class="stat"><strong>9</strong><span>Provinces supported</span></div><div class="stat"><strong>'+n+'</strong><span>Reports on this device</span></div></div><h2>What needs fixing?</h2><p class="sub">Photograph the issue, confirm the area, and create a shareable report.</p><div class="cat-grid">'+CATS.slice(0,8).map(c=>'<button class="cat" data-cat="'+c[0]+'"><i>'+c[1]+'</i>'+safe(c[2])+'</button>').join("")+'</div><div class="duo"><article><div style="font-size:31px">📍</div><strong>Every province, every town</strong><p>Pretoria, Johannesburg, Durban, Cape Town, Gqeberha, Bloemfontein and smaller municipalities. The municipality is confirmed before routing.</p></article><article><div style="font-size:31px">🤝</div><strong>Beyond reporting</strong><p>Track municipal references, confirm a completed repair and later connect approved private contractors. No unapproved road works.</p></article></div><div class="message warn"><b>Prototype:</b> This demo helps prepare and share reports. It cannot yet submit reports directly to municipal databases, summon workers or confirm repairs. Contact routes must be verified before use.</div>';screen.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{type=b.dataset.cat;show("report")})}

function report(){var muni=MUNIC[data.province]||["Other municipality"];screen.innerHTML='<div class="card"><p class="eyebrow" style="color:var(--green);font-size:11px;letter-spacing:2px;font-weight:850">REPORT AN ISSUE • SOUTH AFRICA</p><h2 style="margin:0">What is happening in your street?</h2><p class="sub">Free to report. You choose if and when to send it to the public service.</p><label class="field">1. What type of problem?</label><div class="selectcat">'+CATS.map(c=>'<button type="button" data-type="'+c[0]+'" class="'+(c[0]===type?'selected':'')+'">'+c[1]+' '+safe(c[2])+'</button>').join("")+'</div><label class="field" for="details">2. Describe the problem</label><textarea class="inp" id="details" maxlength="900" placeholder="Example: Deep pothole outside number 14. Cars swerve into the opposite lane.">'+safe(data.details)+'</textarea><p id="suggestion" class="hint">Smart routing suggestion is based on your description and the category you confirm, not automated photo recognition.</p><label class="field" for="upload">3. Add a photo (optional)</label><div class="photo"><label for="upload">📷 Take or choose a photo</label><input id="upload" type="file" accept="image/*" capture="environment">'+(photo?'<img id="photo-preview" alt="Problem photo" src="'+photo+'">':'<div id="photo-slot"></div>')+'<div class="hint">Photo compressed locally for this browser. You control any sharing.</div></div><label class="field">4. Where is the problem?</label><div class="twocol"><div><label class="field" for="province">Province</label><select class="inp" id="province">'+selectOptions(PROV,data.province)+'</select></div><div><label class="field" for="municipality">Municipality</label><select class="inp" id="municipality">'+selectOptions(muni,data.municipality)+'</select></div></div><div id="otherBlock" class="'+(data.municipality==="Other municipality"?"":"hidden")+'"><label class="field" for="otherMunicipality">Municipality name</label><input class="inp" id="otherMunicipality" maxlength="100" value="'+safe(data.otherMunicipality)+'" placeholder="Enter municipality name"></div><div class="twocol"><div><label class="field" for="town">Town / suburb</label><input class="inp" id="town" maxlength="100" value="'+safe(data.town)+'" placeholder="e.g. Pretoria East"></div><div><label class="field" for="street">Street address or landmark</label><input class="inp" id="street" maxlength="200" value="'+safe(data.street)+'" placeholder="e.g. 22 Main Street"></div></div><div class="buttons">'+btn("📍 Use my location","geo","btn light")+'<span class="hint" id="gps">'+(loc?safe(loc):"GPS optional. Your location stays on this device until you share the report.")+'</span></div><label class="field" for="severity">Urgency</label><select class="inp" id="severity"><option value="moderate"'+(data.severity==="moderate"?" selected":"")+'>Routine maintenance</option><option value="high"'+(data.severity==="high"?" selected":"")+'>Hazard — needs urgent attention</option></select><div class="message warn">⚠️ If there is immediate danger to life, contact the relevant emergency service. Do not approach live wires, deep holes or contaminated water. Public infrastructure repairs require proper authorisation.</div><div id="form-error" class="message warn hidden"></div><div class="buttons">'+btn("Create report & find contact","submit")+'</div></div>';screen.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>{capture();type=b.dataset.type;report()});screen.querySelector("#province").onchange=e=>{capture();data.province=e.target.value;data.municipality=(MUNIC[data.province]||[])[0]||"Other municipality";data.otherMunicipality="";report()};screen.querySelector("#municipality").onchange=e=>{data.municipality=e.target.value;capture();screen.querySelector("#otherBlock").classList.toggle("hidden",data.municipality!=="Other municipality")};screen.querySelector("#upload").onchange=onphoto;screen.querySelector("#details").oninput=function(){var t=this.value.toLowerCase(),propose=CATS function onphoto(e){var f=e.target.files[0];if(!f)return;if(!f.type.startsWith("image/")){alert("Please select an image.");return}var fr=new FileReader;fr.onload=function(){var im=new Image;im.onload=function(){var scale=Math.min(1,850/Math.max(im.width,im.height));var c=document.createElement("canvas");c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext("2d").drawImage(im,0,0,c.width,c.height);photo=c.toDataURL("image/jpeg",.55);var old=document.querySelector("#photo-preview")||document.querySelector("#photo-slot");if(old){var x=document.createElement("img");x.id="photo-preview";x.className="preview";x.style="margin-top:9px;width:100%;max-height:230px;object-fit:cover;border-radius:12px";x.src=photo;x.alt="Problem photo";old.replaceWith(x)}};im.src=fr.result};fr.readAsDataURL(f)}

function message(i){return "StreetFix SA report "+i.id+"\nProblem: "+cat(i.type)[2]+"\nUrgency: "+i.severity+"\nLocation: "+[i.street,i.town,i.municipality,i.province,"South Africa"].filter(Boolean).join(", ")+"\nGPS: "+(i.gps||"Not provided")+"\nObserved: "+i.created+"\nDetails: "+i.details+"\nPlease provide a municipal reference number and expected next steps.\n\nPrepared by a resident via StreetFix SA. The report is only delivered if I send it through an official channel."}
function savedView(){var i=list().find(x=>x.id===currentId);if(!i){show("track");return}var r=official(i.municipality,i.type);var routeHtml='<div class="route"><b>🏛️ '+safe(r.title)+'</b><p>'+(!r.unverified?"Based on a published official municipal contact. Verify the current channel before submitting.":"Your municipality is supported for report creation. Its specific contact has not yet been verified in this prototype. Use the national official directory to find and confirm the right service.")+'</p>'+(r.tel?'<a href="tel:'+safe(r.tel)+'">📞 Call '+safe(r.tel)+'</a>':'')+(r.email?'<a id="email-link" href="#">✉️ Prepare email</a>':'')+'<a href="'+safe(r.url||DIR)+'" target="_blank" rel="noopener">↗ Official website</a>'+(r.alternate?'<a href="'+safe(r.alternate)+'" target="_blank" rel="noopener">↗ Fault portal</a>':'')+'</div>';screen.innerHTML='<div class="card"><div class="pill" style="display:inline-block">REPORT SAVED ON THIS DEVICE</div><h2>'+cat(i.type)[1]+' '+safe(cat(i.type)[2])+'</h2><p class="sub">'+safe(i.id)+' • '+safe(i.created)+'</p>'+(i.photo?'<img src="'+i.photo+'" alt="Issue photo" style="max-width:100%;max-height:220px;border-radius:15px;margin-bottom:13px">':'')+'<p>'+safe(i.details)+'</p><p class="sub">📍 '+safe([i.street,i.town,i.municipality,i.province].filter(Boolean).join(", "))+'</p><div class="steps">'+["Saved","Sent","Acknowledged","Resolved"].map((s,n)=>'<span class="'+(n<=i.stage?"done":"")+'">'+s+'</span>').join("")+'</div>'+routeHtml+'<div class="message warn"><b>Not submitted yet.</b> Saving here does not send anything to the municipality. Open its portal, call, or send the prepared message yourself. Keep the official reference number.</div><div class="buttons">'+btn("📋 Copy report","copy","btn light")+btn("↗ Share report","share","btn dark")+'</div><label class="field" for="reference">Official reference number (after submission)</label><input class="inp" id="reference" placeholder="Reference from municipality" value="'+safe(i.reference||"")+'"><label class="field" for="stage">Progress — update only when confirmed</label><select class="inp" id="stage">'+["Saved locally / not sent","Sent by me to municipality","Acknowledged by municipality","Repair verified complete"].map((x,n)=>'<option value="'+n+'"'+(i.stage===n?" selected":"")+'>'+x+'</option>').join("")+'</select><label class="field" for="notes">Notes (optional)</label><textarea class="inp" id="notes" placeholder="Response received, contractor details, repair proof…">'+safe(i.notes||"")+'</textarea><div class="buttons">'+btn("Save tracking update","update")+btn("← All reports","track","btn light")+'</div><p class="tiny">Photos and tracking data are stored only in this browser. There is no municipal integration, dispatch or cloud synchronisation.</p></div>';var em=document.getElementById("email-link");if(em)em.onclick=function(ev){ev.preventDefault();location.href="mailto:"+encodeURIComponent(r.email)+"?subject="+encodeURIComponent("Street repair report — "+i.id)+"&body="+encodeURIComponent(message(i))}}
function update(){var arr=list(),i=arr.find(x=>x.id===currentId);if(!i)return;i.reference=document.getElementById("reference").value.trim().slice(0,150);i.stage=Number(document.getElementById("stage").value);i.notes=document.getElementById("notes").value.slice(0,800);if(save(arr)){show("saved")}else alert("Could not save update.")}
function track(){var a=list();screen.innerHTML='<div class="card"><h2>📋 My street reports</h2><p class="sub">Reports are stored on this device only. No report is automatically delivered to the municipality.</p>'+(a.length?a.map(i=>'<div class="issue">'+(i.photo?'<img class="thumb" src="'+i.photo+'" alt="Issue">':'<div class="thumb">'+cat(i.type)[1]+'</div>')+'<div style="flex:1"><strong>'+safe(cat(i.type)[2])+'</strong><small>'+safe([i.town,i.municipality,i.province].filter(Boolean).join(", "))+'</small><small>'+safe(i.id)+'</small><span class="status">'+["Saved locally","Sent (self-reported)","Acknowledged (self-reported)","Resolved (self-reported)"][i.stage]+'</span></div><button class="btn light" data-view="'+safe(i.id)+'">Open</button></div>').join(""):'<p class="message">No reports yet. Start with a photo of something that needs fixing.</p>')+'<div class="buttons">'+btn("＋ New report","new")+btn("Home","home","btn light")+'</div><p class="tiny">For privacy, nothing is shown publicly and there are no fabricated municipal repair statistics.</p></div>';screen.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{currentId=b.dataset.view;show("saved")})}
document.addEventListener("click",function(e){var b=e.target.closest("[data-action]");if(!b)return;var a=b.dataset.action;if(a==="new"){data={province:"Gauteng",municipality:"City of Tshwane",otherMunicipality:"",town:"",street:"",details:"",severity:"moderate"};photo="";loc="";show("report")}else if(a==="submit")submit();else if(a==="geo")geo();else if(a==="copy"||a==="share"){var i=list().find(x=>x.id===currentId);if(!i)return;var msg=message(i);if(a==="share"&&navigator.share)navigator.share({title:"StreetFix SA issue "+i.id,text:msg}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(msg).then(()=>alert("Report copied. Send it through the official channel."),()=>alert("Copy unavailable on this device."));else prompt("Copy report:",msg)}else if(a==="update")update();else if(["home","report","track"].includes(a))show(a)});
document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>show(b.dataset.nav));
show("home");if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script></body></html>
