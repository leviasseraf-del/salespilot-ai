<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#053a31">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GiveTouch"><meta name="description" content="GiveTouch — The Sandringham Shul. A demonstration donation and Shabbat information kiosk.">
<link rel="manifest" href="manifest.webmanifest">
<title>GiveTouch | The Sandringham Shul</title>
<style>
:root{--forest:#063e35;--deep:#042c27;--mint:#e5f3e8;--cream:#fffcf2;--gold:#d8b976;--ink:#103b32;--muted:#6f8279}
*{box-sizing:border-box}html{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#052d28;color:var(--cream)}body{margin:0;min-height:100vh;min-height:100dvh}button,input,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.shell{min-height:100vh;min-height:100dvh;background:radial-gradient(circle at 50% 16%,#166452 0%,#0b4e42 24%,#05372f 70%,#032921 100%);padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden}
.shell:after{content:"";inset:11px;position:absolute;border:1px solid #d8b97636;pointer-events:none}
.content{width:100%;max-width:660px;display:flex;flex:1;flex-direction:column;align-items:center;position:relative;z-index:1;justify-content:space-between;gap:18px}
.topline{width:100%;display:flex;justify-content:space-between;align-items:center;color:#d9dbc7;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:3px 6px}.topline .demotag{border:1px solid #ffffff40;border-radius:30px;padding:4px 9px;color:#fcf7e8;letter-spacing:1px}
.identity{text-align:center;width:100%;padding-top:clamp(5px,2vh,34px)}.mark{height:76px;width:146px;margin:auto;display:block}.kicker{font-size:11px;letter-spacing:4px;color:var(--gold);text-transform:uppercase;margin-top:8px}.brand{font-family:Georgia,"Times New Roman",serif;font-size:clamp(26px,5vw,43px);font-weight:400;letter-spacing:.3px;line-height:1.15;margin:13px 0 0}.place{font-size:11px;letter-spacing:3.5px;text-transform:uppercase;color:#e2e9df;margin-top:12px}.rule{width:75px;border-top:1px solid var(--gold);margin:23px auto 0}
.main{flex:1;width:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.halo{width:94px;height:94px;display:flex;align-items:center;justify-content:center;border:1px solid #c9b68090;border-radius:50%;background:#ffffff09;box-shadow:0 0 80px #d9ab5b18;margin-bottom:24px}.halo svg{width:44px;height:44px;stroke:#e2ca90}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(36px,7.2vw,67px);line-height:1.1;letter-spacing:-1.5px;font-weight:400;margin:0}.description{color:#e5e9dc;max-width:390px;font-size:clamp(14px,2.5vw,18px);line-height:1.65;margin:18px auto 28px}
.cta{border:1px solid #ead7a9;background:linear-gradient(140deg,#f2dfb0,#c9a15c);color:#143a31;border-radius:8px;font-size:17px;font-weight:700;letter-spacing:.25px;min-height:70px;width:min(100%,430px);box-shadow:0 15px 28px #001b134d;display:flex;align-items:center;justify-content:center;gap:13px;padding:12px 18px}.cta:active{transform:translateY(1px)}.cta svg{width:22px;height:22px;stroke:currentColor}.secondary{color:#e3ddc9;background:transparent;border:1px solid #d2c59b72;border-radius:8px;padding:13px 18px;margin-top:14px}.foot{font-size:11px;color:#d9dfd5a8;text-align:center;padding-bottom:6px;line-height:1.6}.accent{color:var(--gold)}
.panel{width:min(100%,520px);background:#fcfaf1;color:var(--ink);border-radius:14px;padding:clamp(17px,4vw,28px);box-shadow:0 22px 60px #00211e65}.panel h2{font-family:Georgia,serif;font-size:30px;font-weight:normal;line-height:1.15;margin:0 0 7px}.panel p{color:#5d7268;margin:0 0 22px}.amt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:15px 0}.amount{border:1px solid #d2ddd3;border-radius:9px;background:white;min-height:69px;color:var(--ink);font-size:24px;font-weight:650}.amount.selected{background:#e3efe3;border:2px solid #126b51}.input-wrap{display:flex;align-items:center;gap:8px;background:white;border:1px solid #d2ddd3;border-radius:9px;padding:0 18px;height:58px;font-size:20px}.input-wrap input{border:0;outline:none;width:100%;background:transparent;color:var(--ink);font-size:21px}.panel .cta{background:#0e5746;color:#fff;border:0;box-shadow:none;width:100%;min-height:61px}.back{border:0;background:transparent;color:#0d5744;padding:13px;font-weight:600}.note{font-size:12px!important;line-height:1.5;margin:16px 0 0!important;color:#777e75!important}.error{color:#ba3131!important;font-weight:600}.successcheck{font-size:46px;color:#277858;margin-bottom:15px}
.shabbat-title{font-family:Georgia,serif;font-size:clamp(38px,7vw,63px);font-weight:400;line-height:1.06;margin:10px 0}.section-head{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin:19px auto 12px}.info-card{width:min(100%,520px);border:1px solid #d8b9766a;background:#ffffff0d;border-radius:11px;padding:17px 19px;margin:5px 0;text-align:left}.info-row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:8px 0;border-bottom:1px solid #ffffff20;font-size:15px}.info-row:last-child{border:0}.info-row strong{white-space:nowrap;font-size:16px;font-weight:600;color:#fff3d4}.info-row span{color:#ebf0e8}.info-note{font-size:12px;line-height:1.5;color:#d3e1d3;text-align:center;max-width:500px;margin:12px auto}
.prayer-text{white-space:pre-line;font-size:16px;line-height:1.85;text-align:center;color:#fffbec}.mevarchim{border:1px solid #d8b976a3;background:#f8f0d50d;padding:14px 18px;border-radius:9px;width:min(100%,520px);margin:18px auto}.mevarchim b{color:#f6dc9e;letter-spacing:.8px}.mevarchim p{margin:8px 0 0;line-height:1.55;color:#e8ece4;font-size:14px}.hidden{display:none!important}
.admin-shell{background:#eaf0eb;color:#1a443a;min-height:100vh;padding:20px 17px 60px}.admin{max-width:680px;margin:auto}.admin h1{font-family:Georgia,serif;font-size:32px}.admin label{display:block;margin:18px 0 7px;font-weight:650}.admin textarea{display:block;width:100%;min-height:165px;border:1px solid #b4cdc2;border-radius:9px;padding:14px;line-height:1.6;resize:vertical}.admin input{padding:12px;width:100%;border:1px solid #b4cdc2;border-radius:9px}.admin button{background:#0b5e4a;border:0;color:white;border-radius:8px;padding:13px 18px;font-weight:650;margin-top:14px}.admin .notice{border-left:4px solid #b68637;background:#fff6da;padding:12px;line-height:1.6;margin:18px 0}.admin a{color:#075b47}.admin small{color:#5d756d}.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
@media(min-width:900px){.shell{padding:26px 34px}.content{max-width:850px}.identity{padding-top:4vh}.mark{height:95px;width:184px}.brand{font-size:54px}.main{padding:18px 0}.cta{width:min(100%,490px);min-height:80px;font-size:21px}.info-card,.mevarchim{width:min(100%,680px)}.info-row{font-size:21px}.info-row strong{font-size:21px}.prayer-text{font-size:22px}}
</style></head><body><div id="app"></div>
<script>
(()=>{'use strict';
const key="givetouch-sandringham-demo-v2";
const store=()=>{try{return JSON.parse(localStorage.getItem(key))||{}}catch{return {}}};
let cfg=Object.assign({prayers:"Friday Mincha: To be confirmed\nShabbat Shacharit: To be confirmed\nShabbat Mincha: To be confirmed\nMaariv: To be confirmed",note:"",candleOffset:18,havdalah:50},store());
const qp=new URLSearchParams(location.search),preview=qp.get("preview"),admin=qp.has("admin"),app=document.querySelector("#app");let page="home",selected=180,hebcal=null,apiStatus="loading";
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const localParts=(d=new Date())=>Object.fromEntries(new Intl.DateTimeFormat("en-GB",{timeZone:"Africa/Johannesburg",weekday:"short",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(d).map(p=>[p.type,p.value]));
const time=d=>d?new Intl.DateTimeFormat("en-ZA",{timeZone:"Africa/Johannesburg",hour:"numeric",minute:"2-digit",hour12:true}).format(new Date(d)):"To be confirmed";
const formatDay=d=>new Intl.DateTimeFormat("en-ZA",{timeZone:"Africa/Johannesburg",weekday:"long",month:"long",day:"numeric"}).format(new Date(d));
const badge=()=>'<svg class="mark" viewBox="0 0 170 100" role="img" aria-label="Sandringham inspired mirrored S motif and seven-branched square menorah"><g fill="none" stroke="#e3c889" stroke-linejoin="miter" stroke-width="5"><path d="M44 17H15V48H43V82H13"/><path d="M126 17H155V48H127V82H157"/><path d="M85 13V78M72 25V78M98 25V78M59 39V78M111 39V78M46 53V78M124 53V78M46 78H124M79 86H91"/><path d="M80 11h10M67 23h10M93 23h10M54 37h10M106 37h10M41 51h10M119 51h10"/></g></svg>';
const contact='<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 9a7 7 0 0 1 0 6M8 6a11 11 0 0 1 0 12M12 3a15 15 0 0 1 0 18"/><path d="M18 7v10h3"/></svg>';
const appWrap=(body)=>'<div class="shell"><div class="content"><div class="topline"><span>GiveTouch <span class="accent">◈</span></span><span class="demotag">Demonstration</span></div><header class="identity">'+badge()+'<div class="kicker">The Sandringham Shul</div><h2 class="brand">Give with Heart</h2><div class="place">Johannesburg · South Africa</div><div class="rule"></div></header>'+body+'<footer class="foot">A GiveTouch experience <span class="accent">·</span> Prototype · No payments collected<br>Display concept only — not an official synagogue payment system</footer></div></div>';
const softFallback=()=>{const p=localParts();return (p.weekday==="Fri"&&Number(p.hour)>=16)||(p.weekday==="Sat"&&Number(p.hour)<21)};
function items(){return hebcal?.items||[]}
const findCategory=name=>items().find(e=>e.category===name);
function isShabbat(){if(preview==="shabbat")return true;if(preview==="weekday")return false;const c=findCategory("candles")?.date,h=findCategory("havdalah")?.date;if(c&&h)return Date.now()>=new Date(c).getTime()&&Date.now()<new Date(h).getTime();return softFallback()}
const events=()=>{const ev=items();const mev=ev.find(x=>/Mevarchim/i.test((x.title||"")+" "+(x.memo||"")));const molad=ev.find(x=>x.category==="molad"||/Molad/i.test(x.title||""));return {mev,molad,parasha:ev.find(x=>x.category==="parashat")}};
function render(){if(admin){drawAdmin();return}if(isShabbat()){drawShabbat();return}if(page==="amount"){drawAmount();return}if(page==="review"){drawReview();return}if(page==="success"){drawSuccess();return}drawHome()}
function drawHome(){app.innerHTML=appWrap('<main class="main"><div class="halo">'+contact+'</div><h1>A little kindness.<br>A lasting impact.</h1><p class="description">Your generosity makes a difference. Support our community with a simple gift.</p><button class="cta" id="donate">'+contact+'Tap to Donate</button></main>');document.getElementById("donate").onclick=()=>{page="amount";render()}}
function drawAmount(){app.innerHTML=appWrap('<main class="main"><div class="panel"><h2>Choose your amount</h2><p>Every contribution makes a difference.</p><div class="amt-grid">'+[50,100,180,360].map(n=>'<button class="amount '+(selected===n?"selected":"")+'" data-value="'+n+'">R'+n+'</button>').join('')+'</div><label for="other" style="display:block;text-align:left;font-size:13px;font-weight:650">Or enter another amount (ZAR)</label><div class="input-wrap"><b>R</b><input id="other" type="number" inputmode="decimal" min="1" max="100000" placeholder="Other amount" value="'+([50,100,180,360].includes(selected)?"":selected)+'"></div><p class="note error hidden" id="err">Please enter a valid amount between R1 and R100,000.</p><button class="cta" id="next" style="margin-top:18px">Continue</button><button class="back" id="back">Back</button><p class="note">This is a demonstration only. No bank card or payment information will be requested.</p></div></main>');document.querySelectorAll(".amount").forEach(b=>b.onclick=()=>{selected=Number(b.dataset.value);render()});document.getElementById("other").oninput=e=>{if(e.target.value){selected=Number(e.target.value);document.querySelectorAll(".amount").forEach(b=>b.classList.remove("selected"))}};document.getElementById("next").onclick=()=>{if(!Number.isFinite(selected)||selected<1||selected>100000){document.getElementById("err").classList.remove("hidden");return}page="review";render()};document.getElementById("back").onclick=()=>{page="home";render()}}
function drawReview(){app.innerHTML=appWrap('<main class="main"><div class="panel"><h2>Review your gift</h2><p>The Sandringham Shul</p><h1 style="font-size:55px;color:#0b5543">R'+esc(selected.toLocaleString("en-ZA"))+'</h1><p style="margin:17px 0 8px">Next, GiveTouch would securely request card payment through the synagogue’s approved bank.</p><button id="simulate" class="cta">Simulate Donation</button><button class="back" id="back">Change amount</button><p class="note">Demo only — no charge, transfer or tax receipt.</p></div></main>');document.getElementById("simulate").onclick=()=>{page="success";render()};document.getElementById("back").onclick=()=>{page="amount";render()}}
function drawSuccess(){app.innerHTML=appWrap('<main class="main"><div class="panel"><div class="successcheck">✓</div><h2>Thank you for your kindness</h2><p style="font-size:20px;color:#0b5543">R'+esc(selected.toLocaleString("en-ZA"))+'</p><p>This is what the confirmation screen could look like after a verified bank transaction.</p><button class="cta" id="restart">Done</button><p class="note">DEMO confirmation — no money has been collected.</p></div></main>');document.getElementById("restart").onclick=()=>{page="home";render()}}
function drawShabbat(){const c=findCategory("candles")?.date,h=findCategory("havdalah")?.date,evt=events();let mBlock="";if(evt.mev){mBlock='<div class="mevarchim"><b>'+esc(evt.mev.title)+'</b>'+(evt.molad?'<p>'+esc(evt.molad.title)+(evt.molad.memo?" — "+esc(evt.molad.memo):"")+'</p>':'<p>Molad details will appear when supplied by the calendar source.</p>')+'</div>'}const prayers=esc(cfg.prayers||"Prayer times to be confirmed");const prayerLines=prayers.split(/\r?\n/).filter(Boolean);app.innerHTML=appWrap('<main class="main" style="justify-content:flex-start;gap:6px"><h1 class="shabbat-title">Shabbat Shalom</h1><div class="section-head">'+(evt.parasha?esc(evt.parasha.title):'The Sandringham Shul')+'</div>'+mBlock+'<div class="info-card"><div class="section-head" style="margin:0 0 9px;text-align:center">Shabbat Times</div><div class="info-row"><span>Candle Lighting</span><strong>'+esc(time(c))+'</strong></div><div class="info-row"><span>Shabbat Ends</span><strong>'+esc(time(h))+'</strong></div></div><div class="info-card" style="text-align:center"><div class="section-head" style="margin:0 0 10px">Prayer Times</div><div class="prayer-text">'+prayerLines.map(x=>esc(x)).join('<br>')+'</div></div><div class="info-note">'+(apiStatus==="ok"?"Shabbat times for Johannesburg provided by Hebcal.com; local custom and final times require shul approval.":"Calendar times are not available. Please verify times with the shul.")+'<br>Information display only · Donations disabled for Shabbat.</div></main>')}
function drawAdmin(){app.innerHTML='<div class="admin-shell"><div class="admin"><small>GIVETOUCH · DEMO ADMIN</small><h1>The Sandringham Shul</h1><p>Type the prayer times in English. They will appear on the Shabbat information screen.</p><div class="notice"><b>Prototype only.</b> Changes are saved on this browser only. This page is not protected by a login and does not update any other device. Do not enter sensitive information.</div><label for="prayers">Prayer schedule — one line per prayer</label><textarea id="prayers" spellcheck="false" placeholder="Friday Mincha: 5:30 PM&#10;Shabbat Shacharit: 9:00 AM&#10;Shabbat Mincha: 5:00 PM&#10;Maariv: 7:20 PM">'+esc(cfg.prayers)+'</textarea><button id="save">Save Shabbat Schedule</button><span id="saved" style="margin-left:12px"></span><div class="links"><a href="?preview=weekday">Preview Donation Screen</a><a href="?preview=shabbat">Preview Shabbat Screen</a><a href="./">Automatic Display</a></div><p><small>Shabbat candle-lighting and end times are requested automatically from Hebcal for Johannesburg. Confirm local synagogue times and customs before live use. When Hebcal cannot be reached, the display does not invent times.</small></p><p><small>GiveTouch processes no real donations yet. Live bank payments need bank onboarding, certified integration, and tested transaction confirmations.</small></p></div></div>';document.getElementById("save").onclick=()=>{cfg.prayers=document.getElementById("prayers").value.trim().slice(0,2500);try{localStorage.setItem(key,JSON.stringify(cfg));document.getElementById("saved").textContent="Saved on this device ✓"}catch{document.getElementById("saved").textContent="Could not save."}}}
async function loadCalendar(){try{const p=localParts(),query=new URLSearchParams({cfg:"json",geonameid:"993800",M:"on",b:"18",molad:"on",leyning:"off",gy:p.year,gm:String(Number(p.month)),gd:p.day});const res=await fetch("https://www.hebcal.com/shabbat?"+query.toString(),{cache:"no-store"});if(!res.ok)throw Error("calendar HTTP error");const data=await res.json();if(!Array.isArray(data.items))throw Error("missing calendar items");hebcal=data;apiStatus="ok";localStorage.setItem("givetouch-calendar-cache",JSON.stringify({data,at:Date.now()}));render()}catch(e){apiStatus="offline";try{const c=JSON.parse(localStorage.getItem("givetouch-calendar-cache")||"null");if(c&&Date.now()-c.at<5*24*3600000)hebcal=c.data}catch{}render()}}
try{if(!navigator.onLine){const cached=JSON.parse(localStorage.getItem("givetouch-calendar-cache")||"null");if(cached&&Date.now()-cached.at<5*24*3600000)hebcal=cached.data}}catch{}
render();loadCalendar();setInterval(()=>{if(!admin){if(page!=="home"&&isShabbat())page="home";render()}},60000);setInterval(loadCalendar,3600000);
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script></body></html>
