function drawHome(){
app.innerHTML=appWrap('<main class="main home-main"><figure class="shul-photo"><img src="'+shulPhoto+'" alt="Photograph of The Sandringham Shul in Johannesburg" fetchpriority="high"></figure><button class="cta home-donate" id="donate">'+homeIcon.heart+'<span>Tap to Donate</span></button><div class="home-actions" aria-label="Community information"><button class="home-action" id="shabbat-times">'+homeIcon.calendar+'<span>Shabbat<br>Times</span></button><button class="home-action" id="prayer-times">'+homeIcon.book+'<span>Prayer<br>Times</span></button><button class="home-action" id="community-events">'+homeIcon.people+'<span>Community<br>Events</span></button></div></main>',true);
document.getElementById("donate").onclick=()=>{page="amount";render()};
document.getElementById("shabbat-times").onclick=()=>{page="shabbat-info";render()};
document.getElementById("prayer-times").onclick=()=>{page="prayer-info";render()};
document.getElementById("community-events").onclick=()=>{page="events-info";render()};
}
function drawHomeInfo(){
const c=findCategory("candles")?.date,h=findCategory("havdalah")?.date;
let heading="",detail="";
if(page==="shabbat-info"){
heading="Shabbat Times";detail='<p>Johannesburg · Verify final times with the synagogue.</p><div class="info-row"><span>Candle lighting</span><strong>'+esc(time(c))+'</strong></div><div class="info-row"><span>Shabbat ends</span><strong>'+esc(time(h))+'</strong></div><p class="note">Times are provided by Hebcal when available and require confirmation with the shul.</p>';
}else if(page==="prayer-info"){
heading="Prayer Times";detail='<p>The Sandringham Shul</p><p style="white-space:pre-line;text-align:left;line-height:1.8">'+esc(cfg.prayers||"Schedule to be confirmed")+'</p><p class="note">Demonstration schedule. Please verify directly with the shul.</p>';
}else{
heading="Community Events";detail='<p>The Sandringham Shul</p><p>Community announcements and upcoming events will appear here once the synagogue supplies an approved schedule.</p><p class="note">No live events are published in this demonstration.</p>';
}
app.innerHTML=appWrap('<main class="main"><div class="panel"><h2>'+heading+'</h2>'+detail+'<button class="back" id="back-home">Back to home</button></div></main>');
document.getElementById("back-home").onclick=()=>{page="home";render()};
}
function drawAmount(){app.innerHTML=appWrap('<main class="main"><div class="panel"><h2>Choose your amount</h2><p>Every contribution makes a difference.</p><div class="amt-grid">'+[50,100,180,360].map(n=>'<button class="amount '+(selected===n?"selected":"")+'" data-value="'+n+'">R'+n+'</button>').join('')+'</div><label for="other" style="display:block;text-align:left;font-size:13px;font-weight:650">Or enter another amount (ZAR)</label><div class="input-wrap"><b>R</b><input id="other" type="number" inputmode="decimal" min="1" max="100000" placeholder="Other amount" value="'+([50,100,180,360].includes(selected)?"":selected)+'"></div><p class="note error hidden" id="err">Please enter a valid amount between R1 and R100,000.</p><button class="cta" id="next" style="margin-top:18px">Continue</button><button class="back" id="back">Back</button><p class="note">This is a demonstration only. No bank card or payment information will be requested.</p></div></main>');document.querySelectorAll(".amount").forEach(b=>b.onclick=()=>{selected=Number(b.dataset.value);render()});document.getElementById("other").oninput=e=>{if(e.target.value){selected=Number(e.target.value);document.querySelectorAll(".amount").forEach(b=>b.classList.remove("selected"))}};document.getElementById("next").onclick=()=>{if(!Number.isFinite(selected)||selected<1||selected>100000){document.getElementById("err").classList.remove("hidden");return}page="review";render()};document.getElementById("back").onclick=()=>{page="home";render()}}
function drawReview(){app.innerHTML=appWrap('<main class="main"><div class="panel"><h2>Review your gift</h2><p>The Sandringham Shul</p><h1 style="font-size:55px;color:#0b5543">R'+esc(selected.toLocaleString("en-ZA"))+'</h1><p style="margin:17px 0 8px">Next, GiveTouch would securely request card payment through the synagogue’s approved bank.</p><button id="simulate" class="cta">Simulate Donation</button><button class="back" id="back">Change amount</button><p class="note">Demo only — no charge, transfer or tax receipt.</p></div></main>');document.getElementById("simulate").onclick=()=>{page="success";render()};document.getElementById("back").onclick=()=>{page="amount";render()}}
function drawSuccess(){
app.innerHTML=appWrap('<main class="main"><div class="panel"><div class="successcheck">✓</div><h2>Thank you for your kindness</h2><p style="font-size:20px;color:#0b5543">R'+esc(selected.toLocaleString("en-ZA"))+'</p><p>Would you like a receipt by email?</p><div class="receipt-actions"><button class="cta" id="receipt-yes">Yes, email receipt</button><button class="receipt-no" id="receipt-no">No, thank you</button></div><p class="note">DEMO ONLY — no real payment was made and no receipt will be emailed.</p></div></main>');

document.getElementById("receipt-no").onclick=()=>{page="home";render()}

function drawReceiptEmail(){
app.innerHTML=appWrap('<main class="main"><div class="panel"><h2>Email receipt</h2><p>Enter your email address to receive a receipt after a confirmed donation.</p><form id="receipt-form" novalidate><label for="receipt-address" class="receipt-label">Email address</label><input id="receipt-address" type="email" name="receiptEmail" autocomplete="email" inputmode="email" maxlength="254" spellcheck="false" placeholder="you@example.com" required aria-describedby="receipt-warning"><p class="note error hidden" id="receipt-error" role="alert">Please enter a valid email address.</p><button class="cta" type="submit" style="margin-top:20px">Preview email receipt</button></form><button class="back" id="receipt-back">Back</button><p class="note" id="receipt-warning">Demo only: the email address is not saved or sent, and no email is dispatched. Real receipts will require a verified payment and a connected email service.</p></div></main>');
document.getElementById("receipt-form").onsubmit=e=>{
e.preventDefault();const input=document.getElementById("receipt-address");
const v=input.value.trim();
if(v.length>254||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){document.getElementById("receipt-error").classList.remove("hidden");input.focus();return}
receiptEmail=v;input.value="";page="receipt-preview";render()
};
document.getElementById("receipt-back").onclick=()=>{receiptEmail="";page="success";render()}
}

function drawShabbat(){const c=findCategory("candles")?.date,h=findCategory("havdalah")?.date,evt=events();let mBlock="";if(evt.mev){mBlock='<div class="mevarchim"><b>'+esc(evt.mev.title)+'</b>'+(evt.molad?'<p>'+esc(evt.molad.title)+(evt.molad.memo?" — "+esc(evt.molad.memo):"")+'</p>':'<p>Molad details will appear when supplied by the calendar source.</p>')+'</div>'}const prayers=esc(cfg.prayers||"Prayer times to be confirmed");const prayerLines=prayers.split(/\r?\n/).filter(Boolean);app.innerHTML=appWrap('<main class="main" style="justify-content:flex-start;gap:6px"><h1 class="shabbat-title">Shabbat Shalom</h1><div class="section-head">'+(evt.parasha?esc(evt.parasha.title):'The Sandringham Shul')+'</div>'+mBlock+'<div class="info-card"><div class="section-head" style="margin:0 0 9px;text-align:center">Shabbat Times</div><div class="info-row"><span>Candle Lighting</span><strong>'+esc(time(c))+'</strong></div><div class="info-row"><span>Shabbat Ends</span><strong>'+esc(time(h))+'</strong></div></div><div class="info-card" style="text-align:center"><div class="section-head" style="margin:0 0 10px">Prayer Times</div><div class="prayer-text">'+prayerLines.map(x=>esc(x)).join('<br>')+'</div></div><div class="info-note">'+(apiStatus==="ok"?"Shabbat times for Johannesburg provided by Hebcal.com; local custom and final times require shul approval.":"Calendar times are not available. Please verify times with the shul.")+'<br>Information display only · Donations disabled for Shabbat.</div></main>')}
function drawAdmin(){app.innerHTML='<div class="admin-shell"><div class="admin"><small>GIVETOUCH · DEMO ADMIN</small><h1>The Sandringham Shul</h1><p>Type the prayer times in English. They will appear on the Shabbat information screen.</p><div class="notice"><b>Prototype only.</b> Changes are saved on this browser only. This page is not protected by a login and does not update any other device. Do not enter sensitive information.</div><label for="prayers">Prayer schedule — one line per prayer</label><textarea id="prayers" spellcheck="false" placeholder="Friday Mincha: 5:30 PM&#10;Shabbat Shacharit: 9:00 AM&#10;Shabbat Mincha: 5:00 PM&#10;Maariv: 7:20 PM">'+esc(cfg.prayers)+'</textarea><button id="save">Save Shabbat Schedule</button><span id="saved" style="margin-left:12px"></span><div class="links"><a href="?preview=weekday">Preview Donation Screen</a><a href="?preview=shabbat">Preview Shabbat Screen</a><a href="./">Automatic Display</a></div><p><small>Shabbat candle-lighting and end times are requested automatically from Hebcal for Johannesburg. Confirm local synagogue times and customs before live use. When Hebcal cannot be reached, the display does not invent times.</small></p><p><small>GiveTouch processes no real donations yet. Live bank payments need bank onboarding, certified integration, and tested transaction confirmations.</small></p></div></div>';document.getElementById("save").onclick=()=>{cfg.prayers=document.getElementById("prayers").value.trim().slice(0,2500);try{localStorage.setItem(key,JSON.stringify(cfg));document.getElementById("saved").textContent="Saved on this device ✓"}catch{document.getElementById("saved").textContent="Could not save."}}}
async function loadCalendar(){try{const p=localParts(),query=new URLSearchParams({cfg:"json",geonameid:"993800",M:"on",b:"18",molad:"on",leyning:"off",gy:p.year,gm:String(Number(p.month)),gd:p.day});const res=await fetch("https://www.hebcal.com/shabbat?"+query.toString(),{cache:"no-store"});if(!res.ok)throw Error("calendar HTTP error");const data=await res.json();if(!Array.isArray(data.items))throw Error("missing calendar items");hebcal=data;apiStatus="ok";localStorage.setItem("givetouch-calendar-cache",JSON.stringify({data,at:Date.now()}));render()}catch(e){apiStatus="offline";try{const c=JSON.parse(localStorage.getItem("givetouch-calendar-cache")||"null");if(c&&Date.now()-c.at<5*24*3600000)hebcal=c.data}catch{}render()}}
try{if(!navigator.onLine){const cached=JSON.parse(localStorage.getItem("givetouch-calendar-cache")||"null");if(cached&&Date.now()-cached.at<5*24*3600000)hebcal=cached.data}}catch{}
render();loadCalendar();setInterval(()=>{if(!admin){if(page!=="home"&&isShabbat())page="home";render()}},60000);setInterval(loadCalendar,3600000);
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script></body></html>
